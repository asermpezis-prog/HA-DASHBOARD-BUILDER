<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Builder</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="mdi/css/materialdesignicons.min.css">
<link rel="stylesheet" href="style.css?v=0.3.0">
</head>
<body>
<header class="ribbon">
  <div class="rb-group">
    <div class="brand"><i class="mdi mdi-view-dashboard-edit"></i> Dashboard Builder</div>
    <span id="mode" class="pill"></span>
  </div>
  <div class="rb-group">
    <select id="dashSelect" title="Dashboard wählen"></select>
    <button id="btnCopy" title="Dieses Dashboard in Home Assistant als neues Dashboard kopieren"><i class="mdi mdi-content-duplicate"></i> Kopieren …</button>
    <button id="btnReload" title="Aktuellen Stand aus Home Assistant laden"><i class="mdi mdi-refresh"></i></button>
  </div>
  <div class="rb-group">
    <button id="btnUndo" title="Rückgängig (Strg+Z)"><i class="mdi mdi-undo"></i></button>
    <button id="btnRedo" title="Wiederholen (Strg+Y)"><i class="mdi mdi-redo"></i></button>
  </div>
  <div class="rb-group seg" id="deviceSeg" title="Vorschau">
    <button data-dev="pc" class="on" title="PC"><i class="mdi mdi-monitor"></i></button>
    <button data-dev="tablet" title="Tablet"><i class="mdi mdi-tablet"></i></button>
    <button data-dev="phone" title="Handy"><i class="mdi mdi-cellphone"></i></button>
  </div>
  <span class="spacer"></span>
  <span id="dirty" class="dirty" hidden>● nicht übertragen</span>
  <div class="rb-group">
    <button id="btnSaveVersion" title="Stand als Entwurf in der App sichern"><i class="mdi mdi-content-save-outline"></i> Version speichern</button>
    <button id="btnPush" class="primary" title="Änderungen nach Home Assistant übertragen"><i class="mdi mdi-upload"></i> Übertragen …</button>
  </div>
</header>

<div class="layout">
  <aside class="palette">
    <section>
      <h3>Einfügen</h3>
      <div id="blocks" class="blocks"></div>
    </section>
    <section class="tpls">
      <h3>Vorlagen <span id="tplCount" class="muted"></span></h3>
      <div id="tplList" class="tpllist"></div>
    </section>
    <section class="ents">
      <h3>Entitäten <span id="entCount" class="muted"></span></h3>
      <input id="search" type="search" placeholder="Suchen (Name, ID, Raum) …">
      <div class="row">
        <select id="areaFilter"></select>
        <select id="domainFilter"></select>
      </div>
      <label class="chk"><input type="checkbox" id="unusedOnly"> nur noch nicht verwendete</label>
      <label class="chk"><input type="checkbox" id="hideDiag" checked> Diagnose/Konfiguration ausblenden</label>
      <label class="cardtype">Entität einfügen als
        <select id="cardType">
          <option value="tile">Kachel</option>
          <option value="mushroom-template">Raumkarte (Mushroom)</option>
          <option value="mushroom-entity">Mushroom Entity</option>
          <option value="button">Button</option>
          <option value="entities">Liste</option>
          <option value="sensor">Sensor mit Graph</option>
          <option value="history">Verlauf</option>
        </select>
      </label>
      <div id="entityList" class="entlist"></div>
    </section>
  </aside>

  <main class="stage">
    <nav id="viewTabs" class="tabs"></nav>
    <div id="canvasWrap" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
    </div>
    <footer class="statusbar">
      <span id="selInfo" class="muted"></span>
      <span class="spacer"></span>
      <span class="muted">Zoom</span>
      <button id="zoomOut" class="icon" title="Verkleinern"><i class="mdi mdi-minus"></i></button>
      <input id="zoom" type="range" min="50" max="150" step="10" value="100">
      <button id="zoomIn" class="icon" title="Vergrößern"><i class="mdi mdi-plus"></i></button>
      <span id="zoomVal">100 %</span>
    </footer>
  </main>

  <aside class="inspector">
    <div class="ins-tabs">
      <button data-tab="format" class="on"><i class="mdi mdi-palette-outline"></i> Format</button>
      <button data-tab="versions"><i class="mdi mdi-history"></i> Versionen</button>
    </div>
    <div id="formatPane" class="ins-pane"></div>
    <div id="versionsPane" class="ins-pane" hidden></div>
  </aside>
</div>

<div id="ctxMenu" class="ctx" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<datalist id="entOptions"></datalist>
<datalist id="iconOptions"></datalist>
<script src="app.js?v=0.3.0"></script>
</body>
</html>
